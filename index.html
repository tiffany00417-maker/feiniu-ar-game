
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛牛牧場 AR 兔兔找找看</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #fff8ed;
            overflow: hidden;
        }

        #ar-scene {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #top-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(255, 248, 237, 0.92);
            z-index: 10;
        }

        #top-panel h2 {
            margin: 0 0 6px;
            color: #754b28;
            font-size: 21px;
        }

        #status {
            margin: 5px 0;
            color: #5d4935;
            font-size: 15px;
        }

        #bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(255, 248, 237, 0.92);
            z-index: 10;
        }

        #scan-message {
            margin: 0 0 12px;
            color: #754b28;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            margin: 4px;
            font-size: 16px;
            color: white;
            background: #8cbd65;
            cursor: pointer;
        }

        #restart-button {
            background: #d69a58;
        }

        #error-message {
            display: none;
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- 上方資訊 -->
    <div id="top-panel">
        <h2>🐰 AR 兔兔找找看</h2>
        <p id="status">請按下開始 AR</p>
    </div>

    <!-- AR 場景 -->
    <a-scene
        id="ar-scene"
        mindar-image="
            imageTargetSrc: ./rabbit-house.mind;
            autoStart: false;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
        "
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-assets>
        </a-assets>

        <!-- AR 攝影機 -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- 辨識兔子的家 -->
        <a-entity
            id="target"
            mindar-image-target="targetIndex: 0">

            <!-- 綠色 3D 測試球體 -->
            <a-sphere
                position="0 0 0"
                radius="0.3"
                material="shader: flat; color: #00FF00; side: double"
                visible="true">
            </a-sphere>

            <!-- 測試文字 -->
            <a-text
                value="AR 測試成功！"
                position="0 0.5 0"
                align="center"
                color="#FF0000"
                width="2">
            </a-text>

        </a-entity>

    </a-scene>

    <!-- 下方操作區 -->
    <div id="bottom-panel">

        <p id="scan-message">
            請先開啟相機，再掃描兔子的家圖片 🐰
        </p>

        <button id="start-button">
            開始 AR
        </button>

        <button id="restart-button">
            重新掃描
        </button>

        <p id="error-message">
            相機啟動失敗，請確認瀏覽器相機權限。
        </p>

    </div>

    <script>

        const scene = document.querySelector("#ar-scene");
        const target = document.querySelector("#target");

        const startButton = document.querySelector("#start-button");
        const restartButton = document.querySelector("#restart-button");

        const statusText = document.querySelector("#status");
        const scanMessage = document.querySelector("#scan-message");
        const errorMessage = document.querySelector("#error-message");

        let arStarted = false;

        // 開始 AR
        startButton.addEventListener("click", async function () {

            if (arStarted) return;

            statusText.textContent = "正在開啟相機……";
            scanMessage.textContent = "請允許瀏覽器使用相機";

            try {

                if (!scene.hasLoaded) {
                    await new Promise(resolve => {
                        scene.addEventListener("loaded", resolve, {
                            once: true
                        });
                    });
                }

                const arSystem =
                    scene.systems["mindar-image-system"];

                await arSystem.start();

                arStarted = true;

                startButton.style.display = "none";

                statusText.textContent = "相機已開啟！";
                scanMessage.textContent =
                    "請將鏡頭對準兔子的家圖片 🐰";

            } catch (error) {

                console.error("AR 啟動失敗：", error);

                errorMessage.style.display = "block";
                statusText.textContent = "相機啟動失敗";

            }

        });

        // 成功辨識圖片
        target.addEventListener("targetFound", function () {

            statusText.textContent = "🎉 成功找到兔子的家！";

            scanMessage.textContent =
                "兔兔出現了！請觀察綠色測試球體！";

            console.log("成功辨識兔子的家！");

        });

        // 離開辨識範圍
        target.addEventListener("targetLost", function () {

            statusText.textContent =
                "正在尋找兔子的家……";

            scanMessage.textContent =
                "請重新將鏡頭對準圖片";

            console.log("已離開圖片辨識範圍");

        });

        // 重新掃描
        restartButton.addEventListener("click", function () {

            statusText.textContent =
                "請重新掃描兔子的家！";

            scanMessage.textContent =
                "將鏡頭對準兔子的家圖片";

        });

    </script>

</body>
</html>
